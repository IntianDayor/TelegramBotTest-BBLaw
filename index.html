<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample app for BotFather</title>
    <style>

        *{
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            background-image: radial-gradient(circle,#fff, #f0f8ff, #e0fffe, #b0e0e6);
        }

        h2 {
            justify-self: center;
            text-align: center;
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: fit-content;
            box-shadow: 0 2px 4px;
            margin-top: 20px;
            background-color: #fff;
        }

        .rng-button-wrapper {
            display: flex;
            flex-direction: column;
            width: fit-content;
            background-color: #a9a9a9;
            padding: 10px;
            margin: 30px;
            justify-content: center;
            align-items: center;
            border: 3px solid #686868;
            border-radius: 16px;
            box-shadow: 0 20px 0 #686868;
        }

        .rng-button {
            border-radius: 100px;
            padding: 20px;
            margin: 20px;
            width: 200px;
            height: 200px;
            border: 3px solid #d3d3d3;
            box-shadow: 0 16px 0 #d3d3d3;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
        }

        .rng-button:active {
            transform: translateY(16px);
            box-shadow: 0 0 0;
        }

        .result {
            padding: 15px;
            margin: 10px;
            background-color: #dcdcdc;
            border-radius: 10px;
            border: 2px solid #000000;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h2>Random Number Generator</h2>
    <div class="rng-button-wrapper">
        <button type="button" class="rng-button" id="rng-btn">
            Generate Random Number 
        </button>
        <div class="result" id="result">
            Result: 0
            <!--Result appears Dynamically-->
        </div>
    </div>
    <script>
        
        const rngBtn = document.getElementById('rng-btn');
        const result = document.getElementById('result');
        const max = 999;
        const min = 0;

        rngBtn.addEventListener("click", (event) => {
            const rng = Math.floor(Math.random() * (max - min)) + min;
            result.innerText = "Result: " + rng;
        });

    </script>
</body>
</html>
